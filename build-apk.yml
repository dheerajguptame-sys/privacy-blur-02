name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        echo "Searching for Gradle build files in repository..."
        if ls *.zip 1> /dev/null 2>&1; then
          echo "ZIP file detected in repository root. Unzipping..."
          unzip -o *.zip
        fi

        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Building in directory: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Looking for build.gradle or app directory..."
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew || true
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: Project source files missing. Please upload the unzipped project files to this repository."
            exit 1
          fi
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivacyBlur-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
